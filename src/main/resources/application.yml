spring:
  application:
    name: proov-server
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    locale: ko_KR
    locale-resolver: fixed

proov:
  jwt:
    issuer: proov
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
  oauth:
    apple:
      client-ids: ${APPLE_CLIENT_IDS:}
    kakao:
      client-ids: ${KAKAO_CLIENT_IDS:}
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false

logging:
  level:
    org.springframework.web.servlet.PageNotFound: off
